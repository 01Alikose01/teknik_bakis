name: teknik_bakis
description: "Teknik Bakış - Hisse Senedi Takip Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  http: ^1.6.0
  xml: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  cloud_firestore: ^5.6.12
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/ipo_seed.json
    - assets/teknik.jpg
    - assets/tek.png
    - çöp.png
    - king.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/tek.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/tek.png"
  min_sdk_android: 21
  remove_alpha_ios: true
